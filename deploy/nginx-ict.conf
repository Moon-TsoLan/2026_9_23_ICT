# nginx：托管前端静态文件 + 把 /api 反代给 uvicorn。
#
# 安装：
#   sudo cp deploy/nginx-ict.conf /etc/nginx/sites-available/ict.conf
#   sudo ln -sf /etc/nginx/sites-available/ict.conf /etc/nginx/sites-enabled/ict.conf
#   sudo rm -f /etc/nginx/sites-enabled/default        # 去掉默认站点，避免抢 80
#   sudo nginx -t && sudo systemctl reload nginx
#
# 没有域名时 server_name 用 _ ；有域名后把它换成域名，再上 HTTPS。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 上传是"一个文件一个请求"，单文件上限 512MB —— nginx 默认 1MB 会直接 413
    client_max_body_size 600m;
    # 大文件直通：别让 nginx 先落到自己的临时目录再转发
    proxy_request_buffering off;

    root /root/workspace/ICT/web/dist;
    index index.html;

    location /api/ {
        # 注意末尾不要加 "/"：加了会把 /api 前缀吃掉
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 前端是单页应用：刷新任意深链都要回 index.html，否则 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # vite 产物带内容哈希，可以长缓存
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
