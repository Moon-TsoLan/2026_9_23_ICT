[project]
name = "ict-extract"
version = "0.1.0"
description = "Single-announcement extraction pipeline for contest task five."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "lxml>=5.0",
  "openpyxl>=3.1",
  "Pillow>=10.0",
  "pydantic>=2.6",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "tenacity>=8.2",
]

[project.scripts]
ict-run = "ict.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
